name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test kit
        run: npm run test -w @nphuonha/ui-kit

      - name: Verify docs content
        run: npm run check:content -w @nphuonha/ui-demo

      - name: Build kit
        run: npm run build:kit

      - name: Build docs
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
