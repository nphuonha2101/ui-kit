name: CI/CD

on:
  push:
    branches: [main]
    # Skip CI/deploy for changes that cannot affect the kit, docs or deploy.
    paths:
      - "apps/demo/**"
      - "packages/ui-kit/src/**"
      - "packages/ui-kit/scripts/**"
      - "packages/ui-kit/package.json"
      - "packages/ui-kit/tsconfig*.json"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test kit
        run: npm run test -w @nphuonha/ui-kit

      - name: Verify docs content
        run: npm run check:content -w @nphuonha/ui-demo

      - name: Verify generated props
        run: npm run check:props -w @nphuonha/ui-demo

      - name: Build kit
        run: npm run build:kit

      - name: Build docs
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Upload docs build
        uses: actions/upload-artifact@v4
        with:
          name: docs-out
          path: apps/demo/out
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: verify
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository_owner == 'nphuonha2101' &&
      github.actor == 'nphuonha2101'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download docs build
        uses: actions/download-artifact@v4
        with:
          name: docs-out
          path: apps/demo/out

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/demo/out --project-name ui-kit-site --branch main
