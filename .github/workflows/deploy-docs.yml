name: Deploy docs

on:
  push:
    branches: [main]
    # Do not redeploy for README/package metadata changes. The site only
    # depends on the docs app, kit source and deploy configuration.
    paths:
      - "apps/demo/**"
      - "packages/ui-kit/src/**"
      - "packages/ui-kit/scripts/**"
      - "packages/ui-kit/package.json"
      - "packages/ui-kit/tsconfig*.json"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository_owner == 'nphuonha2101' && github.actor == 'nphuonha2101'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test kit
        run: npm run test -w @nphuonha/ui-kit

      - name: Verify docs content
        run: npm run check:content -w @nphuonha/ui-demo

      - name: Build kit
        run: npm run build:kit

      - name: Build docs
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/demo/out --project-name ui-kit-site --branch main
