name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository_owner == 'nphuonha2101' && github.actor == 'nphuonha2101'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Setup npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build kit
        run: npm run build:kit

      - name: Publish
        run: npm publish -w @nphuonha/ui-kit --access public
